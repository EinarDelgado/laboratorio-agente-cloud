name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar app
        run: python app.py
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
